name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering for debugging

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
      - name: Debug - List directory contents
        run: |
          dir
          if (Test-Path "CMakeLists.txt") { echo "CMakeLists.txt found" } else { echo "CMakeLists.txt NOT found" }
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        continue-on-error: false
      - name: Build
        run: |
          cmake --build build --config Release --verbose
        continue-on-error: false
      - name: Check build output
        run: |
          if (Test-Path "build\Release\Before_Effects.exe") { 
            echo "Build successful - executable found"
            dir build\Release\
          } else {
            echo "Build failed - executable not found"
            dir build\
            dir build\Release\
            exit 1
          }
      - name: Deploy
        run: |
          mkdir release -Force
          copy build\Release\Before_Effects.exe release\
          cd release
          windeployqt Before_Effects.exe
          cd ..
      - name: Zip Windows build
        run: powershell Compress-Archive -Path release/* -DestinationPath Before_Effects-windows.zip -Force
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Before_Effects-windows.zip
        if: success()

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
      - name: Debug - List directory contents
        run: |
          ls -la
          if [ -f "CMakeLists.txt" ]; then echo "CMakeLists.txt found"; else echo "CMakeLists.txt NOT found"; fi
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build --config Release --verbose
      - name: Check build output
        run: |
          if [ -d "build/Before_Effects.app" ]; then
            echo "Build successful - app bundle found"
            ls -la build/
          else
            echo "Build failed - app bundle not found"
            ls -la build/
            # Try to find any executable
            find build -name "Before_Effects" -type f 2>/dev/null || echo "No executable found"
            exit 1
          fi
      - name: Deploy
        run: |
          if [ -d "build/Before_Effects.app" ]; then
            macdeployqt build/Before_Effects.app
          else
            echo "Cannot deploy - app bundle not found"
            exit 1
          fi
      - name: Zip macOS build
        run: |
          if [ -d "build/Before_Effects.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent build/Before_Effects.app Before_Effects-macos.zip
          else
            echo "Cannot zip - app bundle not found"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: Before_Effects-macos.zip
        if: success()

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxcb-util1 \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxcb-xfixes0-dev \
            libegl1-mesa-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
      - name: Debug - List directory contents
        run: |
          ls -la
          if [ -f "CMakeLists.txt" ]; then echo "CMakeLists.txt found"; else echo "CMakeLists.txt NOT found"; fi
      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: |
          cmake --build build --config Release --verbose
      - name: Check build output
        run: |
          if [ -f "build/Before_Effects" ]; then
            echo "Build successful - executable found"
            ls -la build/Before_Effects
            file build/Before_Effects
          else
            echo "Build failed - executable not found"
            ls -la build/
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/Before_Effects
        if: success()

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always()  # This will run even if some builds fail, to show what succeeded
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List what we have
        run: |
          echo "=== Artifacts contents ==="
          ls -la artifacts/
          for dir in artifacts/*/; do
            echo "=== $dir ==="
            ls -la "$dir" || echo "Empty or missing"
          done
      - name: Create Release (only if all succeeded)
        if: needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/Before_Effects-windows.zip
            artifacts/macos-release/Before_Effects-macos.zip
            artifacts/linux-release/Before_Effects
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}