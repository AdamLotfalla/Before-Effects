name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt_arch: ""
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-14
            qt_arch: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          ARGS=(-S . -B build -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARGS+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64")
          fi
          cmake "${ARGS[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Check deployment target
        if: runner.os == 'macOS'
        run: |
          vtool -show-build build/Before_Effects.app/Contents/MacOS/Before_Effects | grep -E "minos|platform"
          lipo -info build/Before_Effects.app/Contents/MacOS/Before_Effects

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Before_Effects, release | Out-Null
          Copy-Item build/Release/Before_Effects.exe Before_Effects/
          windeployqt --release --compiler-runtime Before_Effects/Before_Effects.exe
          Compress-Archive -Path Before_Effects -DestinationPath release/Before_Effects-Windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          macdeployqt build/Before_Effects.app
          mkdir -p release
          for i in 1 2 3 4 5; do
            hdiutil create -volname Before_Effects -srcfolder build/Before_Effects.app -ov -format UDZO release/Before_Effects-macOS.dmg && break
            echo "hdiutil failed (attempt $i), retrying..."
            sleep 10
          done
          test -f release/Before_Effects-macOS.dmg

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir release
          export QMAKE=$(which qmake)
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/Before_Effects -d packaging/Before_Effects.desktop -i packaging/Before_Effects.png --plugin qt --output appimage
          mv Before_Effects*.AppImage release/Before_Effects-Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Before_Effects-${{ matrix.name }}
          path: release/

      - name: Upload to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "Uploading to $TAG"
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber