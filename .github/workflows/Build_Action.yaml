name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            qt_arch: ""
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-14
            qt_arch: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist, release | Out-Null
          Copy-Item build/Release/Before_Effects.exe dist/
          windeployqt --release --compiler-runtime dist/Before_Effects.exe
          Compress-Archive -Path dist -DestinationPath release/Before_Effects-Windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Before_Effects.app -dmg
          mkdir release
          mv build/Before_Effects.dmg release/Before_Effects-macOS.dmg

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir release
          export QMAKE=$(which qmake)
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/Before_Effects -d packaging/Before_Effects.desktop -i packaging/Before_Effects.png --plugin qt --output appimage
          mv Before_Effects*.AppImage release/Before_Effects-Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Before_Effects-${{ matrix.name }}
          path: release/

      # - name: Publish release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: release/*