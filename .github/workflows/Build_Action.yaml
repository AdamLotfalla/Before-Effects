name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: ""
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-14
            qt_arch: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.*
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/Before_Effects.exe dist/
          windeployqt --release dist/Before_Effects.exe

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Before_Effects.app -dmg
          mkdir dist
          mv build/Before_Effects.dmg dist/

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp build/Before_Effects dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Before_Effects-${{ matrix.name }}
          path: dist/